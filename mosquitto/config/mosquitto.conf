persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# per_listener_settings: cada listener tiene su propio (allow_anonymous,
# password_file, acl_file). Imprescindible para mezclar tráfico anónimo
# (dashboard, MQTTX Web) con usuarios autenticados de ACL restringida
# (radar_iot_001, nexus_telegraf, futuros publishers AGlabs-nativos).
per_listener_settings true

listener 1883 0.0.0.0
listener_allow_anonymous true
password_file /mosquitto/config/passwordfile
acl_file      /mosquitto/config/aclfile

# WebSocket listener for browser clients (MQTTX Web SPA via nginx proxy)
# y publishers WSS (radar_iot wrapper via wss://mqtt.aglabs.es/mqtt).
listener 9001 0.0.0.0
protocol websockets
listener_allow_anonymous true
password_file /mosquitto/config/passwordfile
acl_file      /mosquitto/config/aclfile

include_dir /mosquitto/config/conf.d
