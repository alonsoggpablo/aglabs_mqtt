persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# per_listener_settings: cada listener tiene su propio (allow_anonymous,
# password_file, acl_file). Imprescindible para mezclar tráfico anónimo
# (dashboard, MQTTX Web) con usuarios autenticados de ACL restringida
# (radar_iot_001, nexus_telegraf, futuros publishers AGlabs-nativos).
per_listener_settings true

listener 1883 0.0.0.0
listener_allow_anonymous true
password_file /mosquitto/config/passwordfile
acl_file      /mosquitto/config/aclfile

# WebSocket listener for browser clients (MQTTX Web SPA via nginx proxy)
# y publishers WSS (radar_iot wrapper via wss://mqtt.aglabs.es/mqtt).
# Anónimos CERRADOS desde 2026-10-09: nginx publica este listener en internet
# (/mqtt sin basic auth) y el ACL da `readwrite #` a los anónimos, así que
# cualquiera podía leer toda la telemetría y mandar RPC a los relés de los Shelly.
# Nadie lo usaba en anónimo (log desde 2026-07-24). Ver CLAUDE.md §Usuarios MQTT.
listener 9001 0.0.0.0
protocol websockets
listener_allow_anonymous false
password_file /mosquitto/config/passwordfile
acl_file      /mosquitto/config/aclfile

# Native MQTT-over-TLS listener para dispositivos que NO hablan WebSockets:
# los Shelly Gen2 (Pro 3EM / Pro EM50) solo tienen cliente MQTT nativo (8883 TLS),
# no pueden usar la ruta WSS 443→9001 de radar_iot. Este listener EXIGE auth
# (allow_anonymous false) — a diferencia de 1883/9001, que mantienen anónimos
# para el dashboard/bridge. Cert = mismo multi-SAN Let's Encrypt de boreas.aglabs.es
# (incluye la SAN mqtt.aglabs.es), copiado a mosquitto/certs/ con owner 1883:1883
# porque mosquitto corre como uid 1883 y no puede leer la privkey root:root de
# /etc/letsencrypt. Ver scripts/sync_certs.sh + hook de renovación.
#
# CERT RSA DEDICADO (2026-08-18). Este listener NO usa el multi-SAN ECDSA de
# boreas.aglabs.es, sino un certificado RSA propio para mqtt.aglabs.es
# (`certbot --cert-name mqtt-iaq-rsa --key-type rsa --preferred-chain "ISRG Root X1"`).
#
# Por qué: los sensores Nanoenvi (Envira) validan la cadena contra un almacén de
# CA congelado en firmware y RECHAZAN la del multi-SAN, que va
# `leaf(ECDSA) -> YE1 -> Root YE -> ISRG Root X2 -> ISRG Root X1`. El cert RSA va
# `leaf(RSA) -> YR1 -> Root YR -> ISRG Root X1`: sin pasar por X2 y con clave RSA,
# que es lo que aceptan hoy en el broker de Tactica. Le pasó a Tactica el
# 12-ago-2026: renovaron a la cadena nueva y se les cayeron los 58 sensores.
#
# Para el resto de clientes es indiferente (RSA + ISRG Root X1 lo acepta todo),
# y nginx sigue usando el multi-SAN ECDSA para los vhosts web — no se toca.
# La copia con owner 1883 la hace scripts/sync_certs.sh (deploy-hook de certbot).
#
# ✅ ACTIVO desde 2026-08-31. `scripts/sync_certs.sh` copia el RSA en cada
# ejecución (y en cada renovación de certbot, que lo tiene como deploy-hook).
# Si alguna vez hay que volver al multi-SAN: cambiar las dos líneas de abajo a
# fullchain.pem / privkey.pem y `docker restart aglabs_mosquitto`.
#
# ⚠ NUNCA apuntar a un fichero que no exista: mosquitto no arranca y se lleva por
# delante el 8883 (Shelly migrados), el 9001 (dashboard/radar) y el bridge.
listener 8883 0.0.0.0
listener_allow_anonymous false
password_file /mosquitto/config/passwordfile
acl_file      /mosquitto/config/aclfile
certfile /mosquitto/certs/rsa_fullchain.pem
keyfile  /mosquitto/certs/rsa_privkey.pem

include_dir /mosquitto/config/conf.d
