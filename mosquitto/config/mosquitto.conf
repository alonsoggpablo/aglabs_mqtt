persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

listener 1883 0.0.0.0
allow_anonymous true

# WebSocket listener for browser clients (MQTTX Web SPA via nginx proxy)
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

include_dir /mosquitto/config/conf.d
