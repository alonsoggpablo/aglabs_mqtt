<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGlabs MQTT — Dashboard</title>
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<style>
  :root {
    --bg: #14171c; --bg2: #1c2028; --bg3: #262b36;
    --fg: #e0e3e8; --fg2: #8a909a; --accent: #6cb6ff;
    --ok: #5dd39e; --err: #fb7185; --warn: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg);
               font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 14px; padding: 9px 16px;
           background: var(--bg2); border-bottom: 1px solid var(--bg3); flex-shrink: 0; }
  header h1 { font-size: 14px; font-weight: 600; }
  header h1 .sub { color: var(--fg2); font-weight: 400; margin-left: 6px; }
  .status { padding: 2px 9px; border-radius: 3px; font-size: 11px; font-weight: 500; }
  .status.ok   { background: var(--ok);   color: #000; }
  .status.err  { background: var(--err);  color: #fff; }
  .status.warn { background: var(--warn); color: #000; }
  header .stats { margin-left: auto; color: var(--fg2); font-size: 12px; }
  header .stats b { color: var(--fg); font-weight: 500; }
  main { flex: 1; display: grid; grid-template-columns: 360px 1fr; overflow: hidden; }

  #tree-wrap { background: var(--bg2); border-right: 1px solid var(--bg3);
               display: flex; flex-direction: column; overflow: hidden; }
  #tree-search { width: 100%; padding: 8px 12px; background: var(--bg3); color: var(--fg);
                 border: none; font-size: 12px; outline: none; flex-shrink: 0; }
  #tree-search::placeholder { color: var(--fg2); }
  #tree { flex: 1; overflow-y: auto; padding: 4px 0; }
  .node { padding: 3px 12px; cursor: pointer; user-select: none; white-space: nowrap;
          overflow: hidden; text-overflow: ellipsis; font-family: 'SF Mono', Menlo, Consolas, monospace;
          font-size: 12px; }
  .node:hover { background: var(--bg3); }
  .node.selected { background: var(--accent); color: #000; }
  .node .count { color: var(--fg2); font-size: 10.5px; margin-left: 6px; }
  .node.selected .count { color: rgba(0,0,0,0.55); }
  .node.branch::before { content: '▸'; display: inline-block; width: 12px; color: var(--fg2);
                         font-family: sans-serif; font-size: 10px; }
  .node.branch.open::before { content: '▾'; }
  .node.leaf::before { content: '·'; display: inline-block; width: 12px; color: var(--fg2);
                       font-family: sans-serif; }
  .node.selected.branch::before, .node.selected.leaf::before { color: rgba(0,0,0,0.55); }

  .right { display: grid; grid-template-rows: minmax(120px, 45%) 1fr; overflow: hidden; }

  #payload { padding: 14px 16px; overflow: auto; background: var(--bg);
             border-bottom: 1px solid var(--bg3); }
  #payload h2 { font-size: 11px; color: var(--fg2); margin-bottom: 6px; font-weight: 500;
                text-transform: uppercase; letter-spacing: 0.5px; }
  #payload .topic { color: var(--accent); font-family: 'SF Mono', Menlo, monospace;
                    font-size: 13px; word-break: break-all; }
  #payload .meta { color: var(--fg2); font-size: 11px; margin-top: 5px; }
  #payload pre { margin-top: 12px; font-family: 'SF Mono', Menlo, Consolas, monospace;
                 font-size: 12px; background: var(--bg2); padding: 12px; border-radius: 4px;
                 overflow: auto; white-space: pre-wrap; word-break: break-word; line-height: 1.4; }
  #payload .empty { color: var(--fg2); font-style: italic; margin-top: 12px; }

  #firehose { overflow: hidden; display: flex; flex-direction: column; background: var(--bg2); }
  #firehose-header { padding: 7px 12px; background: var(--bg3); display: flex; gap: 10px;
                     align-items: center; flex-shrink: 0; }
  #firehose-header h2 { font-size: 11px; color: var(--fg2); font-weight: 500;
                        text-transform: uppercase; letter-spacing: 0.5px; }
  #fh-filter { flex: 1; padding: 4px 8px; background: var(--bg); color: var(--fg);
               border: 1px solid var(--bg3); border-radius: 3px; font-size: 12px; outline: none; }
  #fh-filter::placeholder { color: var(--fg2); }
  #firehose-header button { padding: 4px 10px; background: var(--bg); color: var(--fg);
                            border: 1px solid var(--bg3); border-radius: 3px; cursor: pointer;
                            font-size: 11px; }
  #firehose-header button:hover { background: var(--bg3); }
  #firehose-list { flex: 1; overflow-y: auto; font-family: 'SF Mono', Menlo, Consolas, monospace;
                   font-size: 11px; }
  .msg { padding: 2px 12px; display: grid; grid-template-columns: 70px 1fr 60px;
         gap: 8px; border-bottom: 1px solid var(--bg3); cursor: pointer; align-items: center; }
  .msg:hover { background: var(--bg3); }
  .msg .ts { color: var(--fg2); }
  .msg .topic { color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg .sz { color: var(--fg2); font-size: 10.5px; text-align: right; }
</style>
</head>
<body>
<header>
  <h1>AGlabs MQTT <span class="sub">Mosquitto + bridge Tactica</span></h1>
  <span id="status" class="status warn">connecting…</span>
  <span class="stats">
    <b id="rate">0</b> msg/s ·
    <b id="total">0</b> total ·
    <b id="topics">0</b> topics ·
    <b id="uptime">0s</b>
  </span>
</header>
<main>
  <aside id="tree-wrap">
    <input id="tree-search" placeholder="filtrar topics…" autocomplete="off">
    <div id="tree"></div>
  </aside>
  <section class="right">
    <div id="payload">
      <h2>Topic</h2>
      <div class="empty">Selecciona un topic en el árbol (o haz click en una línea del firehose).</div>
    </div>
    <div id="firehose">
      <div id="firehose-header">
        <h2>Firehose</h2>
        <input id="fh-filter" placeholder="filtrar (substring del topic)…" autocomplete="off">
        <button id="fh-pause">⏸ Pause</button>
        <button id="fh-clear">🗑 Clear</button>
      </div>
      <div id="firehose-list"></div>
    </div>
  </section>
</main>
<script>
(function() {
  const BROKER = 'wss://' + location.host + '/mqtt';
  const SUB = '#';
  const FIREHOSE_MAX = 400;
  const TREE_UPDATE_MS = 750;
  const STATS_UPDATE_MS = 1000;

  const $ = id => document.getElementById(id);
  const statusEl = $('status');
  const rateEl = $('rate'), totalEl = $('total'), topicsEl = $('topics'), uptimeEl = $('uptime');
  const treeEl = $('tree'), searchEl = $('tree-search');
  const payloadEl = $('payload');
  const fhListEl = $('firehose-list'), fhFilterEl = $('fh-filter');
  const fhPauseBtn = $('fh-pause'), fhClearBtn = $('fh-clear');

  // State
  const tree = { children: new Map(), count: 0, fullPath: '' };
  const latest = new Map();
  let totalMessages = 0, periodMessages = 0;
  let selectedTopic = null;
  let fhPaused = false;
  let fhFilter = '';
  let treeDirty = false;
  let connectedAt = null;
  const openBranches = new Set();

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = 'status ' + cls;
  }
  function fmtNum(n) { return n.toLocaleString('es-ES'); }
  function fmtUptime(ms) {
    const s = Math.floor(ms / 1000);
    if (s < 60) return s + 's';
    if (s < 3600) return Math.floor(s/60) + 'm ' + (s%60) + 's';
    return Math.floor(s/3600) + 'h ' + Math.floor((s%3600)/60) + 'm';
  }

  // Tree
  function ensurePath(topic) {
    const parts = topic.split('/');
    let node = tree;
    for (let i = 0; i < parts.length; i++) {
      const name = parts[i];
      let child = node.children.get(name);
      if (!child) {
        child = { children: new Map(), count: 0, fullPath: parts.slice(0, i+1).join('/') };
        node.children.set(name, child);
      }
      node = child;
    }
  }
  function bumpCounts(topic) {
    const parts = topic.split('/');
    let node = tree;
    node.count++;
    for (const p of parts) {
      node = node.children.get(p);
      if (!node) return;
      node.count++;
    }
  }

  function descendantMatches(node, filter) {
    if (node.fullPath && node.fullPath.toLowerCase().includes(filter)) return true;
    for (const child of node.children.values())
      if (descendantMatches(child, filter)) return true;
    return false;
  }

  function renderTree() {
    const filter = searchEl.value.toLowerCase().trim();
    const out = [];
    function walk(node, depth) {
      const entries = [...node.children.entries()].sort((a, b) => a[0].localeCompare(b[0]));
      for (const [name, child] of entries) {
        const isLeaf = child.children.size === 0;
        const path = child.fullPath;
        if (filter && !descendantMatches(child, filter)) continue;
        const isOpen = openBranches.has(path) || (filter && filter.length > 0);
        const cls = ['node', isLeaf ? 'leaf' : 'branch',
                     (isOpen && !isLeaf) ? 'open' : '',
                     selectedTopic === path ? 'selected' : ''].filter(Boolean).join(' ');
        out.push(`<div class="${cls}" data-path="${esc(path)}" style="padding-left:${12 + depth*14}px" title="${esc(path)}">${esc(name)}<span class="count">${fmtNum(child.count)}</span></div>`);
        if (!isLeaf && isOpen) walk(child, depth + 1);
      }
    }
    walk(tree, 0);
    treeEl.innerHTML = out.join('') || '<div style="padding:12px;color:var(--fg2);font-style:italic">sin mensajes todavía</div>';
  }

  treeEl.addEventListener('click', e => {
    const node = e.target.closest('.node');
    if (!node) return;
    const path = node.dataset.path;
    if (node.classList.contains('leaf')) {
      selectTopic(path);
    } else {
      if (openBranches.has(path)) openBranches.delete(path); else openBranches.add(path);
      renderTree();
    }
  });
  searchEl.addEventListener('input', renderTree);

  function selectTopic(topic) {
    selectedTopic = topic;
    const last = latest.get(topic);
    if (!last) {
      payloadEl.innerHTML = `<h2>Topic</h2><div class="topic">${esc(topic)}</div>` +
        `<div class="empty">sin mensajes recibidos todavía</div>`;
    } else {
      let body;
      try { body = JSON.stringify(JSON.parse(last.payload), null, 2); }
      catch { body = last.payload; }
      const ts = new Date(last.ts).toLocaleString('es-ES', { hour12: false });
      payloadEl.innerHTML = `<h2>Topic</h2><div class="topic">${esc(topic)}</div>` +
        `<div class="meta">último mensaje: ${ts} · ${last.payload.length} bytes · ${fmtNum(last.count)} totales</div>` +
        `<pre>${esc(body)}</pre>`;
    }
    renderTree();
  }

  // Firehose
  function appendFirehose(topic, payload, ts) {
    if (fhPaused) return;
    if (fhFilter && !topic.toLowerCase().includes(fhFilter)) return;
    const time = new Date(ts).toLocaleTimeString('es-ES', { hour12: false });
    const div = document.createElement('div');
    div.className = 'msg';
    div.dataset.topic = topic;
    div.innerHTML = `<span class="ts">${time}</span>` +
                    `<span class="topic">${esc(topic)}</span>` +
                    `<span class="sz">${payload.length}b</span>`;
    fhListEl.insertBefore(div, fhListEl.firstChild);
    while (fhListEl.children.length > FIREHOSE_MAX) fhListEl.removeChild(fhListEl.lastChild);
  }
  fhListEl.addEventListener('click', e => {
    const m = e.target.closest('.msg');
    if (m) selectTopic(m.dataset.topic);
  });
  fhPauseBtn.addEventListener('click', () => {
    fhPaused = !fhPaused;
    fhPauseBtn.textContent = fhPaused ? '▶ Resume' : '⏸ Pause';
    fhPauseBtn.style.background = fhPaused ? 'var(--warn)' : '';
    fhPauseBtn.style.color = fhPaused ? '#000' : '';
  });
  fhClearBtn.addEventListener('click', () => fhListEl.innerHTML = '');
  fhFilterEl.addEventListener('input', () => fhFilter = fhFilterEl.value.toLowerCase().trim());

  // MQTT
  setStatus('connecting…', 'warn');
  const client = mqtt.connect(BROKER, {
    clientId: 'aglabs-dash-' + Math.random().toString(36).slice(2, 8),
    keepalive: 60,
    reconnectPeriod: 2000,
    clean: true,
  });
  client.on('connect', () => {
    setStatus('connected', 'ok');
    connectedAt = Date.now();
    client.subscribe(SUB, { qos: 0 }, err => {
      if (err) setStatus('subscribe error', 'err');
    });
  });
  client.on('reconnect', () => setStatus('reconnecting…', 'warn'));
  client.on('close',     () => setStatus('disconnected', 'err'));
  client.on('error',  err => { console.error(err); setStatus('error: ' + err.message, 'err'); });

  client.on('message', (topic, payload) => {
    const ts = Date.now();
    const s = payload.toString('utf-8');
    const wasNew = !latest.has(topic);
    const prev = latest.get(topic);
    latest.set(topic, { payload: s, ts, count: (prev?.count || 0) + 1 });
    if (wasNew) ensurePath(topic);
    bumpCounts(topic);
    treeDirty = true;
    totalMessages++;
    periodMessages++;
    if (selectedTopic === topic) selectTopic(topic);
    appendFirehose(topic, s, ts);
  });

  // Throttled tree render
  setInterval(() => {
    if (treeDirty) { renderTree(); treeDirty = false; }
  }, TREE_UPDATE_MS);

  // Stats
  setInterval(() => {
    rateEl.textContent = (periodMessages / (STATS_UPDATE_MS / 1000)).toFixed(0);
    totalEl.textContent = fmtNum(totalMessages);
    topicsEl.textContent = fmtNum(latest.size);
    uptimeEl.textContent = connectedAt ? fmtUptime(Date.now() - connectedAt) : '0s';
    periodMessages = 0;
  }, STATS_UPDATE_MS);
})();
</script>
</body>
</html>
